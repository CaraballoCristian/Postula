<!-- CREAR EMPRESA MODAL -->
@if (open()) {
  <div class="fixed inset-0 z-[100] flex items-start justify-center pt-[10vh]" style="background: rgba(0,0,0,0.3);" backdropDismiss (dismissed)="cerrar()">
    <div class="card w-full max-w-sm mx-4 animate-fade-in" (click)="$event.stopPropagation()">
      <h3 class="text-base font-semibold mb-4">{{ i18n.t('np.crearEmpresa') }}</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium block mb-1" style="opacity: 0.5;">{{ i18n.t('np.empresaNombre') }}</label>
          <input [(ngModel)]="nombre" class="text-sm" [placeholder]="i18n.t('np.empresaNamePh')" [style.border-color]="error() ? 'var(--error-color)' : ''" (ngModelChange)="error.set('')" />
          @if (error()) { <div class="text-xs mt-1" style="color: var(--error-color);">{{ error() }}</div> }
        </div>
        <div>
          <label class="text-xs font-medium block mb-1" style="opacity: 0.5;">{{ i18n.t('np.empresaLink') }}</label>
          <input [(ngModel)]="link" class="text-sm" [placeholder]="i18n.t('np.empresaLinkPh')" />
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button class="btn btn-outline" (click)="cerrar()">{{ i18n.t('common.cancel') }}</button>
        <button class="btn btn-primary" (click)="enviar()">{{ i18n.t('common.create') }}</button>
      </div>
    </div>
  </div>
}
