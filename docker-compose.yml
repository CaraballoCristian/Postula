services:
  app:
    build: .
    ports:
      - "3033:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-cambia-este-secreto}
      - CLIENT_DIST=/app/public
      - AUTH_RATE_WINDOW_MIN=${AUTH_RATE_WINDOW_MIN:-15}
      - AUTH_LOGIN_RATE_MAX=${AUTH_LOGIN_RATE_MAX:-10}
      - AUTH_REGISTER_RATE_MAX=${AUTH_REGISTER_RATE_MAX:-20}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://localhost:3033}
    volumes:
      - server_data:/app/data
    restart: unless-stopped

volumes:
  server_data:
